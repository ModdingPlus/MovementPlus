# Done to increase the memory available to Gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Mod properties
# NOTE: also bump the hardcoded version in fabric.mod.json and neoforge.mods.toml.
# They are not expanded from here anymore, since filtered resources don't get copied
# by the VS Code Java compiler output, which the loom-generated launch configs run from.
mod_version = 2.0.0
maven_group = moe.qbyte.movement_plus
archives_name = movement_plus
enabled_platforms = fabric,neoforge

# Minecraft properties
minecraft_version = 1.21.1

# Mappings
parchment_version = 2024.11.17

# Dependencies
architectury_api_version = 13.0.8
forge_config_api_port_version = 21.1.6

# Dev environment
mod_menu_version = 11.0.4
fabric_loader_version = 0.19.3
fabric_api_version = 0.116.13+1.21.1
neoforge_version = 21.1.215

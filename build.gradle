plugins {
    // the no-remap loom variant: 26.1+ is unobfuscated, so nothing is remapped anymore
    id 'dev.architectury.loom-no-remap' version '1.17-SNAPSHOT' apply false
    id 'architectury-plugin' version '3.5-SNAPSHOT'
    id 'com.gradleup.shadow' version '9.6.1' apply false
    id 'me.modmuss50.mod-publish-plugin' version '2.1.1'
}

architectury {
    minecraft = project.minecraft_version
}

allprojects {
    group = rootProject.maven_group
    version = rootProject.mod_version
}

subprojects {
    apply plugin: 'dev.architectury.loom-no-remap'
    apply plugin: 'architectury-plugin'
    apply plugin: 'maven-publish'

    base {
        // Set up a suffixed format for the mod jar names, e.g. `example-fabric`.
        archivesName = "$rootProject.archives_name-$project.name"
    }

    repositories {
        // Add repositories to retrieve artifacts from in here.
        // You should only use this when depending on other mods because
        // Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
        // See https://docs.gradle.org/current/userguide/declaring_repositories.html
        // for more information about repositories.
        maven {
            name = 'Fuzs Mod Resources'
            url = 'https://raw.githubusercontent.com/Fuzss/modresources/main/maven/'
        }
        maven {
            name = 'TerraformersMC'
            url = 'https://maven.terraformersmc.com/releases'
        }
    }

    dependencies {
        minecraft "com.mojang:minecraft:$rootProject.minecraft_version"
    }

    java {
        // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
        // if it is present.
        // If you remove this line, sources will not be generated.
        withSourcesJar()

        sourceCompatibility = JavaVersion.VERSION_25
        targetCompatibility = JavaVersion.VERSION_25
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.release = 25
    }

    // Configure Maven publishing.
    publishing {
        publications {
            mavenJava(MavenPublication) {
                artifactId = base.archivesName.get()
                from components.java
            }
        }

        // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
        repositories {
            // Add repositories to publish to here.
            // Notice: This block does NOT have the same function as the block in the top level.
            // The repositories here will be used for publishing your artifact, not for
            // retrieving dependencies.
        }
    }
}

// The blocks below reference tasks of the subprojects (apiJar, shadowJar),
// which only exist once those projects are configured.
evaluationDependsOn ':common'
evaluationDependsOn ':fabric'
evaluationDependsOn ':neoforge'

// Repacks the common api jar under the exact file name the Modrinth maven
// needs for classifier resolution (see the modrinthNeoForge block).
def modrinthApiJar = tasks.register('modrinthApiJar', Jar) {
    def commonApiJar = project(':common').tasks.named('apiJar', Jar)
    dependsOn commonApiJar
    from commonApiJar.map { zipTree(it.archiveFile) }
    destinationDirectory = layout.buildDirectory.dir('modrinthApi')
    archiveFileName = "movement_plus-${mod_version}+neoforge-api.jar"
}

// Uploads the release jars to CurseForge and Modrinth: `./gradlew publishMods`.
// Expects CURSEFORGE_TOKEN / MODRINTH_TOKEN in the environment. Set the gradle
// property `publishDryRun` (-PpublishDryRun) to test without uploading.
publishMods {
    changelog = file('CHANGELOG.md').text
    type = STABLE
    dryRun = providers.gradleProperty('publishDryRun').isPresent()

    def fabricJar = project(':fabric').tasks.named('shadowJar').flatMap { it.archiveFile }
    def neoforgeJar = project(':neoforge').tasks.named('shadowJar').flatMap { it.archiveFile }

    // per-loader site tags: only combinations that were actually tested
    def fabricGameVersions = fabric_game_versions.split(',').toList()
    def neoforgeGameVersions = neoforge_game_versions.split(',').toList()

    def cfOptions = curseforgeOptions {
        // env var first (CI), then gradle property, e.g. from ~/.gradle/gradle.properties
        accessToken = providers.environmentVariable('CURSEFORGE_TOKEN')
                .orElse(providers.gradleProperty('CURSEFORGE_TOKEN'))
        projectId = '579424'
        javaVersions.add(JavaVersion.VERSION_25)
        clientRequired = true
        serverRequired = true
        requires 'architectury-api'
    }

    def mrOptions = modrinthOptions {
        accessToken = providers.environmentVariable('MODRINTH_TOKEN')
                .orElse(providers.gradleProperty('MODRINTH_TOKEN'))
        projectId = 'Zg4Gfb1a' // movement_plus
        requires 'architectury-api'
    }

    curseforge('curseforgeFabric') {
        from cfOptions
        minecraftVersions.addAll(fabricGameVersions)
        file = fabricJar
        modLoaders.add('fabric')
        displayName = "Movement Plus ${mod_version} [Fabric]"
        requires 'fabric-api', 'forge-config-api-port'
        optional 'modmenu'
    }

    curseforge('curseforgeNeoForge') {
        from cfOptions
        minecraftVersions.addAll(neoforgeGameVersions)
        file = neoforgeJar
        modLoaders.add('neoforge')
        displayName = "Movement Plus ${mod_version} [NeoForge]"
    }

    modrinth('modrinthFabric') {
        from mrOptions
        minecraftVersions.addAll(fabricGameVersions)
        file = fabricJar
        modLoaders.add('fabric')
        // unique per-loader version numbers give unambiguous Modrinth maven
        // coordinates (maven.modrinth:movement_plus:<version>+<loader>)
        version = "${mod_version}+fabric"
        displayName = "Movement Plus ${mod_version} [Fabric]"
        requires 'fabric-api', 'forge-config-api-port'
        optional 'modmenu'
    }

    modrinth('modrinthNeoForge') {
        from mrOptions
        minecraftVersions.addAll(neoforgeGameVersions)
        file = neoforgeJar
        modLoaders.add('neoforge')
        version = "${mod_version}+neoforge"
        displayName = "Movement Plus ${mod_version} [NeoForge]"
        // the api jar rides along; the Modrinth maven matches additional files
        // by exact name, so maven.modrinth:movement_plus:<version>+neoforge:api
        // requires the file to be named <slug>-<version>+neoforge-api.jar
        additionalFiles.from(modrinthApiJar)
    }
}

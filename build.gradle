plugins {
    id 'dev.architectury.loom' version '1.11-SNAPSHOT' apply false
    id 'architectury-plugin' version '3.4-SNAPSHOT'
    id 'com.gradleup.shadow' version '8.3.6' apply false
    id 'me.modmuss50.mod-publish-plugin' version '2.1.1'
}

architectury {
    minecraft = project.minecraft_version
}

allprojects {
    group = rootProject.maven_group
    version = rootProject.mod_version
}

subprojects {
    apply plugin: 'dev.architectury.loom'
    apply plugin: 'architectury-plugin'
    apply plugin: 'maven-publish'

    base {
        // Set up a suffixed format for the mod jar names, e.g. `example-fabric`.
        archivesName = "$rootProject.archives_name-$project.name"
    }

    repositories {
        // Add repositories to retrieve artifacts from in here.
        // You should only use this when depending on other mods because
        // Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
        // See https://docs.gradle.org/current/userguide/declaring_repositories.html
        // for more information about repositories.
        maven {
            name = 'ParchmentMC'
            url = 'https://maven.parchmentmc.org'
        }
        maven {
            name = 'Fuzs Mod Resources'
            url = 'https://raw.githubusercontent.com/Fuzss/modresources/main/maven/'
        }
        maven {
            name = 'TerraformersMC'
            url = 'https://maven.terraformersmc.com/releases'
        }
    }

    loom {
        silentMojangMappingsLicense()
    }

    dependencies {
        minecraft "net.minecraft:minecraft:$rootProject.minecraft_version"
        mappings loom.layered {
            it.officialMojangMappings()
            it.parchment("org.parchmentmc.data:parchment-$rootProject.minecraft_version:$rootProject.parchment_version@zip")
        }
    }

    java {
        // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
        // if it is present.
        // If you remove this line, sources will not be generated.
        withSourcesJar()

        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.release = 21
    }

    // Configure Maven publishing.
    publishing {
        publications {
            mavenJava(MavenPublication) {
                artifactId = base.archivesName.get()
                from components.java
            }
        }

        // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
        repositories {
            // Add repositories to publish to here.
            // Notice: This block does NOT have the same function as the block in the top level.
            // The repositories here will be used for publishing your artifact, not for
            // retrieving dependencies.
        }
    }
}

// Uploads the release jars to CurseForge and Modrinth: `./gradlew publishMods`.
// Expects CURSEFORGE_TOKEN / MODRINTH_TOKEN in the environment. Set the gradle
// property `publishDryRun` (-PpublishDryRun) to test without uploading.
publishMods {
    changelog = file('CHANGELOG.md').text
    type = STABLE
    dryRun = providers.gradleProperty('publishDryRun').isPresent()

    def fabricJar = project(':fabric').tasks.named('remapJar').flatMap { it.archiveFile }
    def neoforgeJar = project(':neoforge').tasks.named('remapJar').flatMap { it.archiveFile }

    def cfOptions = curseforgeOptions {
        // env var first (CI), then gradle property, e.g. from ~/.gradle/gradle.properties
        accessToken = providers.environmentVariable('CURSEFORGE_TOKEN')
                .orElse(providers.gradleProperty('CURSEFORGE_TOKEN'))
        projectId = '579424'
        minecraftVersions.add(minecraft_version)
        javaVersions.add(JavaVersion.VERSION_21)
        clientRequired = true
        serverRequired = true
        requires 'architectury-api'
    }

    def mrOptions = modrinthOptions {
        accessToken = providers.environmentVariable('MODRINTH_TOKEN')
                .orElse(providers.gradleProperty('MODRINTH_TOKEN'))
        projectId = 'Zg4Gfb1a' // movement_plus
        minecraftVersions.add(minecraft_version)
        requires 'architectury-api'
    }

    curseforge('curseforgeFabric') {
        from cfOptions
        file = fabricJar
        modLoaders.add('fabric')
        displayName = "Movement Plus ${mod_version} [Fabric]"
        requires 'fabric-api', 'forge-config-api-port'
        optional 'modmenu'
    }

    curseforge('curseforgeNeoForge') {
        from cfOptions
        file = neoforgeJar
        modLoaders.add('neoforge')
        displayName = "Movement Plus ${mod_version} [NeoForge]"
    }

    modrinth('modrinthFabric') {
        from mrOptions
        file = fabricJar
        modLoaders.add('fabric')
        displayName = "Movement Plus ${mod_version} [Fabric]"
        requires 'fabric-api', 'forge-config-api-port'
        optional 'modmenu'
    }

    modrinth('modrinthNeoForge') {
        from mrOptions
        file = neoforgeJar
        modLoaders.add('neoforge')
        displayName = "Movement Plus ${mod_version} [NeoForge]"
    }
}

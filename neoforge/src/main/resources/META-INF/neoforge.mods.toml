modLoader = "javafml"
loaderVersion = "[4,)"
issueTrackerURL = "https://github.com/ModdingPlus/MovementPlus/issues"
license = "Unlicense"

[[mods]]
modId = "movement_plus"
version = "${version}"
displayName = "Movement Plus"
displayURL = "https://www.curseforge.com/minecraft/mc-mods/movement_plus"
authors = "Qb"
description = '''
A mod that allows for configurable movement such as midair jumps.
'''
logoFile = "assets/movement_plus/logo.png"

[[dependencies.movement_plus]]
modId = "neoforge"
type = "required"
# 26.1.2 floor: NeoForge never stabilized on the earlier hotfixes and
# Architectury's NeoForge jar needs >=26.1.2.21-beta anyway
versionRange = "[26.1.2,26.2)"
ordering = "NONE"
side = "BOTH"

[[dependencies.movement_plus]]
modId = "minecraft"
type = "required"
versionRange = "[26.1,26.2)"
ordering = "NONE"
side = "BOTH"

[[dependencies.movement_plus]]
modId = "architectury"
type = "required"
versionRange = "[20.0.0,)"
ordering = "AFTER"
side = "BOTH"

[[mixins]]
config = "movement_plus.mixins.json"

architectury {
    common rootProject.enabled_platforms.split(',')
}

dependencies {
    // We depend on Fabric Loader here to use the Fabric @Environment annotations,
    // which get transformed to the correct annotations on each platform.
    // Do NOT use other classes from Fabric Loader.
    implementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    // Architectury API. This is optional, and you can comment it out if you don't need it.
    implementation "dev.architectury:architectury:$rootProject.architectury_api_version"

    // NeoForge's config API to compile common code against; provided at runtime by
    // NeoForge itself and by Forge Config API Port on Fabric.
    api "fuzs.forgeconfigapiport:forgeconfigapiport-common-neoforgeapi:$rootProject.forge_config_api_port_version"
}

// The public surface other mods compile against: the api package (events) and
// the registry package (attributes, sounds). Since 26.1 the game is unobfuscated,
// so there is only one namespace anyway; consumers use a plain compileOnly on
// the api classifier.
def apiJar = tasks.register('apiJar', Jar) {
    from sourceSets.main.output
    include 'moe/qbyte/movement_plus/api/**'
    include 'moe/qbyte/movement_plus/registry/**'
    archiveClassifier = 'api'
}

assemble.dependsOn apiJar

publishing.publications.named('mavenJava', MavenPublication) {
    artifact apiJar
}
